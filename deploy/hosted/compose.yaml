# Uptivora — hosted SaaS deployment (operator use only; customers use deploy/selfhosted).
#
#   sh init.sh            # once: .env and generated secrets
#   docker compose up -d
#
# Same images and hardening as the self-hosted bundle; differences: hosted edition,
# billing provider setting, several worker replicas and more API processes.
name: uptivora-hosted

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "10" }

x-backend: &backend
  <<: *hardening
  image: ${UPTIVORA_IMAGE_PREFIX:-uptivora}/api:${UPTIVORA_VERSION:?Set UPTIVORA_VERSION in .env}
  env_file: .env
  environment: &backend-env
    UPTIVORA_ENV: production
    UPTIVORA_EDITION: hosted
    UPTIVORA_PUBLIC_URL: ${UPTIVORA_PUBLIC_URL:-https://${UPTIVORA_DOMAIN:?Set UPTIVORA_DOMAIN in .env}}
    UPTIVORA_DATABASE_URL: postgresql+asyncpg://uptivora@db:5432/uptivora
    UPTIVORA_DATABASE_PASSWORD_FILE: /run/secrets/db_password
    UPTIVORA_SECRET_KEY_FILE: /run/secrets/secret_key
    UPTIVORA_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
    UPTIVORA_STRIPE_WEBHOOK_SECRET_FILE: /run/secrets/stripe_webhook_secret
    UPTIVORA_BILLING_PROVIDER: ${UPTIVORA_BILLING_PROVIDER:-disabled}
    UPTIVORA_TRUSTED_PROXIES: '["${UPTIVORA_SUBNET:-10.250.48.0/24}"]'
    UPTIVORA_SIGNER_URL: http://signer:8100
    UPTIVORA_SIGNER_TOKEN_FILE: /run/secrets/signer_token
  secrets: [db_password, secret_key, smtp_password, stripe_webhook_secret, signer_token]

services:
  db:
    <<: *hardening
    image: postgres:17-alpine
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs: ["/tmp", "/run/postgresql"]
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-200}
    environment:
      POSTGRES_USER: uptivora
      POSTGRES_DB: uptivora
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    shm_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptivora -d uptivora"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    <<: *backend
    restart: "no"
    command: ["python", "-m", "app.cli", "migrate"]
    networks: [data]
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *backend
    environment:
      <<: *backend-env
      WEB_CONCURRENCY: ${UPTIVORA_API_PROCESSES:-4}
    networks: [edge, data, signing]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    networks: [edge, data, signing]
    deploy:
      replicas: ${UPTIVORA_WORKERS:-2}
    depends_on:
      migrate: { condition: service_completed_successfully }
    stop_grace_period: 30s

  # Licence signing (docs/LICENSE_KEY_OPERATIONS.md). The only service that can read the shop
  # signing key; reachable solely from api and worker over the internal "signing" network.
  signer:
    <<: *hardening
    image: ${UPTIVORA_IMAGE_PREFIX:-uptivora}/api:${UPTIVORA_VERSION}
    command: ["python", "-m", "app.signer", "serve"]
    environment:
      UPTIVORA_ENV: production
      UPTIVORA_EDITION: hosted
      UPTIVORA_PUBLIC_URL: ${UPTIVORA_PUBLIC_URL:-https://${UPTIVORA_DOMAIN}}
      UPTIVORA_SECRET_KEY_FILE: /run/secrets/secret_key
      UPTIVORA_SIGNER_TOKEN_FILE: /run/secrets/signer_token
      UPTIVORA_SIGNER_KEY_ID: ${UPTIVORA_SIGNER_KEY_ID:-}
      UPTIVORA_SIGNER_DAILY_LIMIT: ${UPTIVORA_SIGNER_DAILY_LIMIT:-25}
    secrets: [secret_key, signer_token, licence_signing_key]
    volumes:
      - signer_data:/data
    networks: [signing]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    <<: *hardening
    image: ${UPTIVORA_IMAGE_PREFIX:-uptivora}/web:${UPTIVORA_VERSION}
    environment:
      UPTIVORA_EDITION: hosted
      UPTIVORA_API_INTERNAL_URL: http://api:8000
    tmpfs: ["/tmp", "/app/.next/cache:mode=1777"]
    networks: [edge]
    depends_on:
      api: { condition: service_healthy }

  caddy:
    <<: *hardening
    image: caddy:2-alpine
    cap_add: [NET_BIND_SERVICE]
    environment:
      UPTIVORA_SITE_ADDRESS: ${UPTIVORA_SITE_ADDRESS:-${UPTIVORA_DOMAIN}}
      UPTIVORA_TLS: ${UPTIVORA_TLS:-auto}
    ports:
      - "${UPTIVORA_HTTP_PORT:-80}:80"
      - "${UPTIVORA_HTTPS_PORT:-443}:443"
      - "${UPTIVORA_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ../selfhosted/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on: [web, api]

  backup:
    <<: *hardening
    image: postgres:17-alpine
    cap_add: [DAC_OVERRIDE]
    entrypoint: ["/bin/sh", "/usr/local/bin/uptivora-backup"]
    command: ["schedule"]
    environment:
      PGHOST: db
      PGUSER: uptivora
      PGDATABASE: uptivora
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_VERIFY_WEEKDAY: ${BACKUP_VERIFY_WEEKDAY:-7}
      TZ: ${TZ:-UTC}
    secrets: [db_password]
    volumes:
      - ../selfhosted/backup.sh:/usr/local/bin/uptivora-backup:ro
      - ${BACKUP_DIR:-./backups}:/backups
    networks: [data]
    depends_on:
      db: { condition: service_healthy }

networks:
  edge:
    ipam:
      config:
        - subnet: ${UPTIVORA_SUBNET:-10.250.48.0/24}
  data:
    internal: true
  # API/worker <-> signer only; no route anywhere else.
  signing:
    internal: true

volumes:
  pgdata:
  signer_data:
  caddy_data:
  caddy_config:

secrets:
  db_password: { file: ./secrets/db_password }
  secret_key: { file: ./secrets/secret_key }
  smtp_password: { file: ./secrets/smtp_password }
  stripe_webhook_secret: { file: ./secrets/stripe_webhook_secret }
  signer_token: { file: ./secrets/signer_token }
  licence_signing_key: { file: ./secrets/licence_signing_key }
